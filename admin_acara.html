<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Acara & Kelas Lomba</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f6f9; margin: 20px; }
        .navbar { background: #1e3a8a; padding: 15px; border-radius: 8px; margin-bottom: 20px; text-align: center; }
        .navbar a { color: white; text-decoration: none; font-weight: bold; margin: 0 15px; padding: 8px 15px; background: rgba(255,255,255,0.1); border-radius: 5px; transition: 0.3s; }
        .navbar a:hover { background: white; color: #1e3a8a; }
        .navbar a.active { background: #10b981; color: white; }

        .container { max-width: 900px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1, h2 { color: #1e3a8a; margin-bottom: 15px; }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; }

        .btn-submit { width: 100%; padding: 12px; background: #10b981; color: white; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; margin-top: 10px; }
        .btn-submit:hover { background: #059669; }

        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #e2e8f0; padding: 12px; text-align: left; font-size: 14px; }
        th { background: #f8fafc; color: #1e3a8a; }
    </style>
</head>
<body>

<div class="container">
    <!-- Menu Navigasi -->
    <div class="navbar">
        <a href="index.html">💻 Kasir</a>
        <a href="admin_acara.html" class="active">⚙️ Admin Event</a>
        <a href="scanner.html" target="_blank">📷 Scanner QR</a>
    </div>

    <h1>Kelola Acara & Kelas Lomba</h1>
    <p>Buat kelas baru dan tentukan jumlah stok nomor gantangan.</p>

    <!-- Form Tambah Acara -->
    <div style="background: #f8fafc; padding: 20px; border-radius: 8px; border: 1px solid #e2e8f0; margin-bottom: 30px;">
        <h2>Tambah Kelas Baru</h2>
        <div class="form-group">
            <label>Nama Acara / Gantangan</label>
            <input type="text" id="namaAcara" placeholder="Contoh: Latihan Prestasi BANTIM">
        </div>
        <div class="form-group">
            <label>Nama Kelas</label>
            <input type="text" id="namaKelas" placeholder="Contoh: Murai Batu VIP">
        </div>
        <div class="form-group">
            <label>Harga Tiket (Rp)</label>
            <input type="number" id="hargaTiket" placeholder="Contoh: 50000">
        </div>
        <div class="form-group">
            <label>Jumlah Stok Gantangan (Total Nomor)</label>
            <input type="number" id="stokGantangan" placeholder="Contoh: 30 atau 60">
        </div>
        <button class="btn-submit" onclick="tambahAcara()">Simpan Kelas Lomba</button>
    </div>

    <!-- Tabel Daftar Acara & Tombol Hapus -->
    <h2>Daftar Kelas yang Aktif</h2>
    <table>
        <thead>
            <tr>
                <th>No</th>
                <th>Nama Acara</th>
                <th>Kelas</th>
                <th>Harga</th>
                <th>Stok</th>
                <th>Aksi</th>
            </tr>
        </thead>
        <tbody id="tabelAcara">
            <tr><td colspan="6" style="text-align:center;">Memuat data...</td></tr>
        </tbody>
    </table>
</div>

<!-- Firebase SDK & Logika Utama -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyAgfX4MG0GmGnSn3sLFs9W1tc-ooho5JgE",
    authDomain: "bantim-enterprise.firebaseapp.com",
    projectId: "bantim-enterprise",
    storageBucket: "bantim-enterprise.firebasestorage.app",
    messagingSenderId: "921322033041",
    appId: "1:921322033041:web:06bea8592ddc41025c1430",
    measurementId: "G-1CHZZSN7Y5"
};

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // 1. Fungsi Tambah Acara ke Firestore
    window.tambahAcara = async function() {
        const namaAcara = document.getElementById('namaAcara').value;
        const namaKelas = document.getElementById('namaKelas').value;
        const harga = parseFloat(document.getElementById('hargaTiket').value);
        const stok = parseInt(document.getElementById('stokGantangan').value);

        if (!namaAcara || !namaKelas || isNaN(harga) || isNaN(stok)) {
            alert("Harap isi semua kolom dengan benar!");
            return;
        }

        try {
            await addDoc(collection(db, "acara_lomba"), {
                nama_acara: namaAcara,
                kelas: namaKelas,
                harga_rp: harga,
                stok_gantangan: stok,
                dibuat_pada: new Date().toISOString()
            });

            alert("Kelas lomba berhasil ditambahkan!");
            document.getElementById('namaKelas').value = "";
            document.getElementById('hargaTiket').value = "";
            document.getElementById('stokGantangan').value = "";
        } catch (error) {
            alert("Gagal menyimpan: " + error.message);
        }
    };

    // 2. Realtime Listener Menampilkan Daftar Acara & Tombol Hapus
    onSnapshot(collection(db, "acara_lomba"), (snapshot) => {
        const tabel = document.getElementById('tabelAcara');
        tabel.innerHTML = "";
        let no = 1;

        if (snapshot.empty) {
            tabel.innerHTML = `<tr><td colspan="6" style="text-align:center; padding: 15px;">Belum ada data acara.</td></tr>`;
            return;
        }

        snapshot.forEach((docSnap) => {
            const data = docSnap.data();
            const idDoc = docSnap.id;

            tabel.innerHTML += `
                <tr>
                    <td>${no++}</td>
                    <td>${data.nama_acara}</td>
                    <td>${data.kelas}</td>
                    <td>Rp ${data.harga_rp.toLocaleString()}</td>
                    <td>${data.stok_gantangan} Gantangan</td>
                    <td>
                        <button onclick="hapusAcara('${idDoc}')" style="background: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer;">Hapus</button>
                    </td>
                </tr>
            `;
        });
    });

    // 3. Fungsi Hapus Acara Berdasarkan ID Firestore
    window.hapusAcara = async function(id) {
        const konfirmasi = confirm("Apakah Anda yakin ingin menghapus kelas/acara ini?");
        if (!konfirmasi) return;

        try {
            await deleteDoc(doc(db, "acara_lomba", id));
            alert("Acara berhasil dihapus!");
        } catch (error) {
            alert("Gagal menghapus acara: " + error.message);
        }
    };
</script>

</body>
</html>
