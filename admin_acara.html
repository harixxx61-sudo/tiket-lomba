<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kasir Tiket Lomba Burung</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f6f9; margin: 20px; }
        .navbar { background: #1e3a8a; padding: 15px; border-radius: 8px; margin-bottom: 20px; text-align: center; }
        .navbar a { color: white; text-decoration: none; font-weight: bold; margin: 0 15px; padding: 8px 15px; background: rgba(255,255,255,0.1); border-radius: 5px; transition: 0.3s; }
        .navbar a:hover { background: white; color: #1e3a8a; }
        .navbar a.active { background: #10b981; color: white; }

        .container { max-width: 900px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1, h2 { color: #1e3a8a; margin-bottom: 15px; }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; }
        .form-group select, .form-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; }

        .btn-submit { width: 100%; padding: 12px; background: #10b981; color: white; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; margin-top: 10px; }
        .btn-submit:hover { background: #059669; }

        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #e2e8f0; padding: 12px; text-align: left; font-size: 14px; }
        th { background: #f8fafc; color: #1e3a8a; }
    </style>
</head>
<body>

<div class="container">
    <!-- Menu Navigasi -->
    <div class="navbar">
        <a href="index.html" class="active">💻 Kasir</a>
        <a href="admin_acara.html">⚙️ Admin Event</a>
        <a href="scanner.html" target="_blank">📷 Scanner QR</a>
    </div>

    <h1>Kasir Penjualan Tiket Lomba</h1>
    <p>Pilih kelas lomba dan masukkan nomor gantangan untuk mencetak/merekam tiket.</p>

    <!-- Form Transaksi Kasir -->
    <div style="background: #f8fafc; padding: 20px; border-radius: 8px; border: 1px solid #e2e8f0; margin-bottom: 30px;">
        <div class="form-group">
            <label>Pilih Kelas Lomba</label>
            <select id="pilihAcara" onchange="updateInfoHarga()">
                <option value="">-- Pilih Kelas --</option>
            </select>
        </div>
        <div class="form-group">
            <label>Nomor Gantangan</label>
            <input type="number" id="nomorGantangan" placeholder="Contoh: 1, 2, 15, dst">
        </div>
        <div class="form-group">
            <label>Nama Pemilik / Peserta</label>
            <input type="text" id="namaPeserta" placeholder="Nama Pemilik Burung">
        </div>
        <button class="btn-submit" onclick="prosesJualTiket()">Jual & Simpan Tiket</button>
    </div>

    <!-- Riwayat Penjualan Tiket & Opsi Hapus -->
    <h2>Riwayat Tiket Terjual</h2>
    <table>
        <thead>
            <tr>
                <th>No</th>
                <th>Waktu</th>
                <th>Kelas</th>
                <th>No GNT</th>
                <th>Peserta</th>
                <th>Aksi</th>
            </tr>
        </thead>
        <tbody id="tabelTiketTerjual">
            <tr><td colspan="6" style="text-align:center;">Memuat data...</td></tr>
        </tbody>
    </table>
</div>

<!-- Firebase SDK & Logika Kasir -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAgfX4MG0GmGnSn3sLFs9W1tc-ooho5JgE",
      authDomain: "bantim-enterprise.firebaseapp.com",
      projectId: "bantim-enterprise",
      storageBucket: "bantim-enterprise.firebasestorage.app",
      messagingSenderId: "921322033041",
      appId: "1:921322033041:web:06bea0592ddc41025c1430"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let dataAcaraCache = {};

    // 1. Muat Opsi Kelas Lomba ke Dropdown Kasir
    async function muatDropdownAcara() {
        const select = document.getElementById('pilihAcara');
        const querySnapshot = await getDocs(collection(db, "acara_lomba"));
        
        select.innerHTML = `<option value="">-- Pilih Kelas --</option>`;
        querySnapshot.forEach((docSnap) => {
            const data = docSnap.data();
            dataAcaraCache[docSnap.id] = data;
            select.innerHTML += `<option value="${docSnap.id}">${data.nama_acara} - ${data.kelas} (Rp ${data.harga_rp.toLocaleString()})</option>`;
        });
    }
    muatDropdownAcara();

    // 2. Proses Jual Tiket
    window.prosesJualTiket = async function() {
        const idAcara = document.getElementById('pilihAcara').value;
        const noGantangan = document.getElementById('nomorGantangan').value;
        const namaPeserta = document.getElementById('namaPeserta').value;

        if (!idAcara || !noGantangan || !namaPeserta) {
            alert("Harap lengkapi semua kolom!");
            return;
        }

        const acaraInfo = dataAcaraCache[idAcara];

        try {
            await addDoc(collection(db, "tiket_terjual"), {
                id_acara: idAcara,
                nama_acara: acaraInfo.nama_acara,
                kelas: acaraInfo.kelas,
                harga: acaraInfo.harga_rp,
                nomor_gantangan: noGantangan,
                nama_peserta: namaPeserta,
                waktu_beli: new Date().toLocaleString()
            });

            alert("Tiket berhasil dicetak & disimpan!");
            document.getElementById('nomorGantangan').value = "";
            document.getElementById('namaPeserta').value = "";
        } catch (error) {
            alert("Gagal menjual tiket: " + error.message);
        }
    };

    // 3. Realtime Listener Tabel Riwayat Tiket Beserta Tombol Hapus
    onSnapshot(collection(db, "tiket_terjual"), (snapshot) => {
        const tabel = document.getElementById('tabelTiketTerjual');
        tabel.innerHTML = "";
        let no = 1;

        if (snapshot.empty) {
            tabel.innerHTML = `<tr><td colspan="6" style="text-align:center; padding: 15px;">Belum ada tiket terjual.</td></tr>`;
            return;
        }

        snapshot.forEach((docSnap) => {
            const data = docSnap.data();
            const idDoc = docSnap.id;

            tabel.innerHTML += `
                <tr>
                    <td>${no++}</td>
                    <td>${data.waktu_beli}</td>
                    <td>${data.nama_acara} (${data.kelas})</td>
                    <td><b>No. ${data.nomor_gantangan}</b></td>
                    <td>${data.nama_peserta}</td>
                    <td>
                        <button onclick="hapusTiket('${idDoc}')" style="background: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer;">Hapus</button>
                    </td>
                </tr>
            `;
        });
    });

    // 4. Fungsi Hapus Tiket Terjual dari Firestore
    window.hapusTiket = async function(id) {
        const konfirmasi = confirm("Apakah Anda yakin ingin menghapus/membatalkan tiket ini?");
        if (!konfirmasi) return;

        try {
            await deleteDoc(doc(db, "tiket_terjual", id));
            alert("Tiket berhasil dihapus!");
        } catch (error) {
            alert("Gagal menghapus tiket: " + error.message);
        }
    };
</script>

</body>
</html>
