<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kasir Tiket Lomba Burung</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f6f9; margin: 20px; }
        .navbar { background: #1e3a8a; padding: 15px; border-radius: 8px; margin-bottom: 20px; text-align: center; }
        .navbar a { color: white; text-decoration: none; font-weight: bold; margin: 0 15px; padding: 8px 15px; background: rgba(255,255,255,0.1); border-radius: 5px; transition: 0.3s; }
        .navbar a:hover { background: white; color: #1e3a8a; }
        .navbar a.active { background: #10b981; color: white; }

        .container { max-width: 1100px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1, h2 { color: #1e3a8a; margin-bottom: 5px; }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; }
        .form-group select, .form-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; }

        /* Grid Gantangan */
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(75px, 1fr)); gap: 10px; margin-top: 15px; max-height: 400px; overflow-y: auto; padding: 10px; border: 1px solid #e2e8f0; border-radius: 8px; background: #f8fafc; }
        .gantangan-btn { padding: 12px 5px; text-align: center; font-weight: bold; border-radius: 6px; border: none; cursor: pointer; font-size: 14px; transition: 0.2s; }
        .tersedia { background: #10b981; color: white; }
        .tersedia:hover { background: #059669; }
        .terisi { background: #ef4444; color: white; cursor: not-allowed; opacity: 0.7; }

        .row { display: flex; gap: 20px; }
        .col { flex: 1; }

        .btn-submit { width: 100%; padding: 12px; background: #2563eb; color: white; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; margin-top: 10px; }
        .btn-submit:hover { background: #1d4ed8; }
    </style>
</head>
<body>

<div class="container">
    <!-- Menu Navigasi -->
    <div class="navbar">
        <a href="index.html" class="active">💻 Kasir</a>
        <a href="admin_acara.html">⚙️ Admin Event</a>
        <a href="scanner.html" target="_blank">📷 Scanner QR</a>
    </div>

    <h1>Kasir Penjualan Tiket Lomba</h1>
    <p>Pilih kelas lomba yang dibuat dari panel admin, lalu pilih nomor gantangan.</p>

    <div class="row" style="margin-top: 20px;">
        <!-- Kolom Kiri: Input Pembeli & Pilih Kelas -->
        <div class="col">
            <div class="form-group">
                <label>Pilih Kelas Lomba (Dari Admin)</label>
                <select id="pilihanKelas" onchange="muatGantangan()">
                    <option value="">-- Memuat Kelas dari Admin... --</option>
                </select>
            </div>
            <div class="form-group">
                <label>Nama Peserta / Pemilik</label>
                <input type="text" id="namaPeserta" placeholder="Masukkan nama peserta">
            </div>
            <div class="form-group">
                <label>Nomor WhatsApp</label>
                <input type="text" id="waPeserta" placeholder="08xxxxxxxxxx">
            </div>
            <div class="form-group">
                <label>Nama Burung / Amunisi</label>
                <input type="text" id="namaBurung" placeholder="Contoh: Petir Jr">
            </div>
            
            <div style="background: #f1f5f9; padding: 15px; border-radius: 8px; margin-top: 20px;">
                <p style="margin: 0; font-size: 14px; color: #555;">Nomor Gantangan Dipilih:</p>
                <h2 id="infoGantanganPilih" style="color: #2563eb; margin: 5px 0 0 0;">Belum dipilih</h2>
            </div>

            <button class="btn-submit" onclick="prosesPesanTiket()">Cetak & Simpan Tiket</button>
        </div>

        <!-- Kolom Kanan: Grid Gantangan -->
        <div class="col">
            <label style="font-weight: bold; font-size: 14px;">Pilih Nomor Gantangan:</label>
            <div id="gridGantangan" class="grid-container">
                <span style="color: #666; font-size: 13px; grid-column: span 4;">Silakan pilih kelas lomba terlebih dahulu di sebelah kiri.</span>
            </div>
            <div style="margin-top: 10px; font-size: 12px; display: flex; gap: 15px;">
                <span><span style="display:inline-block;width:12px;height:12px;background:#10b981;border-radius:3px;"></span> Kosong</span>
                <span><span style="display:inline-block;width:12px;height:12px;background:#ef4444;border-radius:3px;"></span> Terisi</span>
            </div>
        </div>
    </div>
</div>

<!-- Firebase SDK -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAgfX4MG0GmGnSn3sLFs9W1tc-ooho5JgE",
      authDomain: "bantim-enterprise.firebaseapp.com",
      projectId: "bantim-enterprise",
      storageBucket: "bantim-enterprise.firebasestorage.app",
      messagingSenderId: "921322033041",
      appId: "1:921322033041:web:06bea0592ddc41025c1430"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let selectedGantangan = null;
    let currentStok = 0;
    let dataKelasMap = {}; 

    // 1. Ambil daftar kelas dari koleksi 'acara_lomba'
    onSnapshot(collection(db, "acara_lomba"), (snapshot) => {
        const select = document.getElementById('pilihanKelas');
        select.innerHTML = '<option value="">-- Pilih Kelas Lomba --</option>';
        dataKelasMap = {};

        if (snapshot.empty) {
            select.innerHTML = '<option value="">(Belum ada kelas dibuat di Admin)</option>';
            return;
        }

        snapshot.forEach((docSnap) => {
            const data = docSnap.data();
            const id = docSnap.id;
            dataKelasMap[id] = data; 
            
            select.innerHTML += `<option value="${id}">${data.nama_acara} - ${data.kelas} (${data.stok_gantangan}G) - Rp${data.harga_rp.toLocaleString()}</option>`;
        });
    });

    // 2. Render grid gantangan dan sinkronkan dengan tiket yang sudah dibeli berdasarkan nama kelas
    window.muatGantangan = function() {
        const kelasId = document.getElementById('pilihanKelas').value;
        const grid = document.getElementById('gridGantangan');
        selectedGantangan = null;
        document.getElementById('infoGantanganPilih').innerText = "Belum dipilih";

        if (!kelasId) {
            grid.innerHTML = '<span style="color: #666; font-size: 13px; grid-column: span 4;">Silakan pilih kelas lomba terlebih dahulu.</span>';
            return;
        }

        const kelasData = dataKelasMap[kelasId];
        currentStok = kelasData.stok_gantangan;

        // PERBAIKAN UTAMA: Menggunakan filter berdasarkan 'kelas' (sama persis dengan yang disimpan admin_acara.html)
        const q = query(collection(db, "tiket"), where("kelas", "==", kelasData.kelas));
        
        onSnapshot(q, (snapshot) => {
            const gantanganTerisi = [];
            snapshot.forEach((doc) => {
                gantanganTerisi.push(parseInt(doc.data().no_gantangan));
            });

            grid.innerHTML = "";
            for (let i = 1; i <= currentStok; i++) {
                const isTerisi = gantanganTerisi.includes(i);
                const btn = document.createElement('button');
                btn.className = `gantangan-btn ${isTerisi ? 'terisi' : 'tersedia'}`;
                btn.innerText = i;
                
                if (isTerisi) {
                    btn.disabled = true;
                } else {
                    btn.onclick = () => pilihGantangan(i);
                }
                grid.appendChild(btn);
            }
        });
    }

    window.pilihGantangan = function(no) {
        selectedGantangan = no;
        document.getElementById('infoGantanganPilih').innerText = `Gantangan No. ${no}`;
    }

    // 3. Proses Simpan Tiket dengan struktur data yang cocok untuk Admin & Scanner
    window.prosesPesanTiket = async function() {
        const kelasId = document.getElementById('pilihanKelas').value;
        const nama = document.getElementById('namaPeserta').value;
        const wa = document.getElementById('waPeserta').value;
        const burung = document.getElementById('namaBurung').value;

        if (!kelasId || !nama || selectedGantangan === null) {
            alert("Harap pilih kelas lomba, isi nama peserta, dan pilih nomor gantangan!");
            return;
        }

        const kelasData = dataKelasMap[kelasId];
        const idTiketUnik = "TIK-" + Math.floor(100000 + Math.random() * 900000);

        try {
            await addDoc(collection(db, "tiket"), {
                id_tiket: idTiketUnik,
                kelas: kelasData.kelas,             // Dicocokkan agar terbaca di tabel admin & scanner
                harga: kelasData.harga_rp,
                no_gantangan: selectedGantangan,
                nama: nama,
                wa: wa,
                burung: burung,
                status_scan: false,
                dibuat_pada: new Date().toISOString()
            });

            alert(`Tiket berhasil dicetak!\nID: ${idTiketUnik}\nGantangan: ${selectedGantangan}`);
            
            // Reset form input
            document.getElementById('namaPeserta').value = "";
            document.getElementById('waPeserta').value = "";
            document.getElementById('namaBurung').value = "";
            selectedGantangan = null;
            document.getElementById('infoGantanganPilih').innerText = "Belum dipilih";
            muatGantangan();
        } catch (error) {
            alert("Gagal memesan tiket: " + error.message);
        }
    }
</script>
</body>
</html>
